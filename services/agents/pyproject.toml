[project]
name = "a9-agents"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "a9-contracts",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "redis>=5",
  "arq>=0.26",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a9_agents"]
