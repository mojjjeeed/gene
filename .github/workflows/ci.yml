name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Both toolchains are needed up front: the contracts break-test drives tsc and mypy together.
      - run: make setup

      - name: Generated contracts match schemas
        run: make check-generated

      - run: pnpm typecheck
      - run: pnpm test
      - run: make lint
      - run: make test
