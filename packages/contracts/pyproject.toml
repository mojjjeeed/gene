[project]
name = "a9-contracts"
version = "0.0.0"
description = "Pydantic models generated from packages/contracts/schemas. Do not edit by hand."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/a9_contracts"]
