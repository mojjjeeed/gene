[project]
name = "a9-agents"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "a9-contracts",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "redis>=5",
  "arq>=0.26",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
  "anthropic>=0.40",
  "httpx>=0.27",
  "tenacity>=9",
  "defusedxml>=0.7",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a9_agents"]
