name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # DB tests fail (not skip) if Postgres is unreachable.
      A9_REQUIRE_DB: "1"
      PG_PORT: 5432
      A9_PG_ADMIN_URL: postgresql://postgres@localhost:5432/postgres
      A9_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/a9
      A9_REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Both toolchains are needed up front: the contracts break-test drives tsc and mypy together.
      - run: make setup

      - name: Generated contracts match schemas
        run: make check-generated

      - name: Migrations round trip (up, down, up)
        run: |
          psql -h localhost -U postgres -c 'CREATE DATABASE a9'
          make migrate-check

      - run: pnpm typecheck
      - run: pnpm test
      - run: make lint
      - run: make test
      - name: Golden-set evaluations (reports NOT MEASURED until the sets are labelled)
        run: make eval
